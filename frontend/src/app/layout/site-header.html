<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" routerLink="/" aria-label="RecipeHub, ir al inicio">
      <svg class="brand__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="16" fill="currentColor" />
        <path d="M9 22c0-7.5 5-12 14-12 0 8-4.5 12-11 12-1 0-2-.1-3-.3z" fill="#ffffff" />
        <path d="M10 22l7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </svg>
      <span class="brand__name">RecipeHub</span>
    </a>

    <nav aria-label="Principal">
      <ul class="nav">
        <li>
          <a
            class="nav__link"
            routerLink="/"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            >Recetas</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>
